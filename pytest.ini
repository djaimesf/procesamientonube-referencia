[pytest]
# carpeta donde pytest busca los archivos de prueba
testpaths = tests
# agrega la raiz del repo al PYTHONPATH para poder importar el codigo del proyecto
pythonpath = .
# -ra: muestra un resumen corto de todos los tests que no pasaron (fallos, skips, etc.)
addopts = -ra
# ignora SOLO el aviso interno de pyspark 3.5.3 por usar distutils (SPARK-38660)
filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning
